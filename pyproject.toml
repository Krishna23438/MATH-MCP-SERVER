
[project]
name = "math-mcp-server"
version = "0.1.0"
description = "Math MCP Server with LangGraph and Groq"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastmcp==3.4.11",
    "mcp>=1.30.0,<2",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.2.1",
    "langchain-mcp-adapters==0.3.2",
    "langgraph>=1.2.24",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
